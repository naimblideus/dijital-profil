<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>OG — Mehmet Naim Çetin</title>
<link rel="stylesheet" href="varlik/font/fontlar.css">
<style>
  html, body { margin: 0; background: #0B1220; }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #0B1220; color: #F2EFE8;
    font-family: "Manrope", "Segoe UI", Arial, sans-serif;
  }
  .og-logo {
    position: absolute; left: 0; top: 0; width: 630px; height: 630px;
    background: url("varlik/video/ident-poster.jpg") center / cover no-repeat;
  }
  .og-perde {
    position: absolute; left: 0; top: 0; width: 720px; height: 630px;
    background: linear-gradient(to right, rgba(11,18,32,0) 40%, #0B1220 100%);
  }
  .og-metin { position: absolute; left: 560px; right: 72px; top: 50%; transform: translateY(-50%); }
  h1 { font-size: 66px; font-weight: 700; line-height: 1.08; letter-spacing: -.025em; margin: 0 0 12px; }
  .rol { font-size: 26px; font-weight: 500; color: #A9B0BD; margin: 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 28px; padding: 10px 18px; border-radius: 999px;
    background: #121C30; box-shadow: inset 0 0 0 1px rgba(242,239,232,.08);
    font-size: 17px; font-weight: 600; color: #F2EFE8;
  }
  .pill b { color: #3DB8BC; font-weight: 600; }
  .alt { margin: 18px 0 0; font-size: 16px; font-weight: 500; color: #7F8A9C; }
</style>
</head>
<body>
<div class="og">
  <div class="og-logo"></div>
  <div class="og-perde"></div>
  <div class="og-metin">
    <h1>Mehmet Naim Çetin</h1>
    <p class="rol">Kurucu — Nextus</p>
    <div class="pill"><b>Fraunhofer</b> — Türkiye Temsilcisi</div>
    <p class="alt">Medipol Teknopark · İTÜ ARI Teknopark, İstanbul</p>
  </div>
</div>
</body>
</html>
